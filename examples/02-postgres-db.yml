name: Stoney with Postgres
on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        ports: [5432:5432]
        env: { POSTGRES_DB: demo, POSTGRES_PASSWORD: postgres }
    
    steps:
      - uses: actions/checkout@v4

      - name: Wait for Postgres
        run: |
          sudo apt-get install -y postgresql-client
          for i in {1..15}; do
            if pg_isready -h localhost -p 5432 -U postgres -d demo; then echo "✅ Ready"; exit 0; fi
            sleep 2
          done
          exit 1

      - name: Seed Database
        run: PGPASSWORD=postgres psql -h localhost -U postgres -d demo -f ./scripts/seed.sql

      - name: Run Stoney
        uses: stoney-dev/stoney@main
        with:
          api_token: ${{ secrets.STONEY_API_TOKEN }}
          db_url: "postgresql://postgres:postgres@localhost:5432/demo"
          suite: "contracts/*.yml"