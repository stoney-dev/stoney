name: Stoney Stress Test
on: [workflow_dispatch, pull_request]

jobs:
  stoney:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Stoney
        uses: stoney-dev/stoney@main
        with:
          api_token: ${{ secrets.STONEY_API_TOKEN }}
          base_url: "https://api.myapp.com"
          suite: "contracts/*.yml"
          # Production-hardened settings
          retries: "5"
          timeout_ms: "60000" # 60 seconds for slow operations
          upload_artifact: "true"