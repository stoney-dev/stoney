name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  version_or_release_pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      # This creates (or updates) the "Version Packages" PR when changesets exist.
      - name: Create Version Packages PR
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}