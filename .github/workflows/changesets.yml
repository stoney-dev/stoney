name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version_or_publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stoney-dev"

      # IMPORTANT: do NOT set version here; let it respect root packageManager "pnpm@10.29.2"
      - uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Create Version Packages PR OR publish (if version PR merged)
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm -C packages/runner publish --no-git-checks
        env:
          # ✅ Use PAT so PR creation is allowed even when Actions is blocked
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          # ✅ Publish auth (GitHub Packages)
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}