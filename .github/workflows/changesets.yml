name: Changesets

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  version_or_publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@stoney-dev"

      - uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Ensure dist is committed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/runner/dist; then
            echo ""
            echo "❌ packages/runner/dist is out of date before publish."
            echo "Run locally:"
            echo "  pnpm -C packages/runner build"
            echo "  git add packages/runner/dist"
            echo "  git commit -m \"chore(runner): update dist\""
            echo ""
            echo "Diff:"
            git --no-pager diff -- packages/runner/dist
            exit 1
          fi

      - name: Create Version Packages PR OR publish after merge
        uses: changesets/action@v1
        with:
          version: pnpm changeset version
          publish: pnpm publish:runner
        env:
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}