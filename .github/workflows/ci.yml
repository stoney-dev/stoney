name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Ensure dist exists + smoke test
        run: |
          test -f packages/runner/dist/cli.cjs
          node packages/runner/dist/cli.cjs hello

      - name: Ensure dist is committed (no drift)
        run: |
          if ! git diff --quiet -- packages/runner/dist; then
            echo ""
            echo "❌ packages/runner/dist is out of date."
            echo "Run: pnpm -C packages/runner build"
            echo "Then commit: git add packages/runner/dist"
            echo ""
            echo "Diff:"
            git --no-pager diff -- packages/runner/dist
            exit 1
          fi