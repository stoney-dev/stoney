name: CI

on:
  pull_request:
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  build_and_verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Smoke test CLI
        run: |
          set -euo pipefail
          test -f packages/runner/dist/cli.cjs
          node packages/runner/dist/cli.cjs hello

      - name: Ensure dist is committed
        run: |
          set -euo pipefail
          if ! git diff --quiet -- packages/runner/dist; then
            echo ""
            echo "❌ packages/runner/dist is out of date."
            echo "Run locally:"
            echo "  pnpm -C packages/runner build"
            echo "  git add packages/runner/dist"
            echo "  git commit -m \"chore(runner): update dist\""
            echo ""
            echo "Diff:"
            git --no-pager diff -- packages/runner/dist
            exit 1
          fi