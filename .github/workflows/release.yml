name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Verify dist exists
        run: test -f packages/runner/dist/cli.cjs

      - name: Create GitHub Release (attach runner dist)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            packages/runner/dist/cli.cjs
            packages/runner/package.json
            action.yml