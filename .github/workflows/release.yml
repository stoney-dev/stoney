name: Release

on:
  push:
    branches: [main]
    paths:
      - "packages/runner/**"
      - "action.yml"
      - "pnpm-lock.yaml"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      bump:
        description: "Optional manual bump override"
        required: false
        default: ""
        type: choice
        options:
          - ""
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ✅ Prevent infinite loop: the workflow commits to main, which triggers push again
      - name: Stop if this is a release commit
        shell: bash
        run: |
          SUBJECT="$(git log -1 --pretty=%s)"
          echo "Last commit subject: $SUBJECT"
          if echo "$SUBJECT" | grep -q "^chore(release):"; then
            echo "Release commit detected; skipping."
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Safety check (node_modules must not be tracked)
        shell: bash
        run: |
          if git ls-files | grep -q node_modules; then
            echo "ERROR: node_modules is tracked in git. Remove it before releasing."
            git ls-files | grep node_modules | head -n 50
            exit 1
          fi

      - name: Determine bump type
        id: bump
        shell: bash
        run: |
          # Manual override via workflow_dispatch input
          if [ -n "${{ inputs.bump }}" ]; then
            echo "bump=${{ inputs.bump }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"

          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            RANGE="HEAD~20..HEAD"
          else
            RANGE="$BEFORE..$AFTER"
          fi

          echo "Inspecting commits in range: $RANGE"
          MSG="$(git log --format=%B $RANGE)"

          if echo "$MSG" | grep -q "BREAKING CHANGE"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$MSG" | grep -Eq "^[a-zA-Z]+(\(.+\))?!:"; then
            echo "bump=major" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$MSG" | grep -Eq "^feat(\(.+\))?:"; then
            echo "bump=minor" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$MSG" | grep -Eq "^fix(\(.+\))?:"; then
            echo "bump=patch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "bump=patch" >> "$GITHUB_OUTPUT"

      - name: Bump version (runner)
        shell: bash
        run: |
          cd packages/runner
          npm version ${{ steps.bump.outputs.bump }} --no-git-tag-version

      - name: Build bundled runner
        run: pnpm -C packages/runner build

      - name: Verify dist exists
        shell: bash
        run: |
          test -f packages/runner/dist/cli.cjs || (echo "dist/cli.cjs missing" && exit 1)

      - name: Read bumped version
        id: v
        shell: bash
        run: |
          echo "version=$(node -p "require('./packages/runner/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Commit version bump + dist + action.yml
        shell: bash
        run: |
          git config user.name "stoney-bot"
          git config user.email "actions@users.noreply.github.com"
          git add packages/runner/package.json packages/runner/dist action.yml pnpm-lock.yaml
          git commit -m "chore(release): v${{ steps.v.outputs.version }}" || (echo "Nothing to commit" && exit 1)

      - name: Tag and push
        shell: bash
        run: |
          VERSION="v${{ steps.v.outputs.version }}"
          git tag "$VERSION"
          git tag -f v0
          git push origin main
          git push origin "$VERSION"
          git push origin -f v0

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: v${{ steps.v.outputs.version }}
          generate_release_notes: true
