name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Resolve tag
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout (tag)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.vars.outputs.tag }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Verify dist exists
        run: test -f packages/runner/dist/cli.cjs

      - name: Verify dist is committed (required)
        shell: bash
        run: |
          set -euo pipefail

          if ! git diff --quiet -- packages/runner/dist; then
            echo ""
            echo "❌ Refusing to release: packages/runner/dist differs from built output."
            echo ""
            echo "Fix this on main BEFORE tagging:"
            echo "  pnpm install"
            echo "  pnpm -C packages/runner build"
            echo "  git add packages/runner/dist"
            echo "  git commit -m \"build: update runner dist\""
            echo "  git push"
            echo ""
            echo "Then create/push the tag again:"
            echo "  git tag -a ${{ steps.vars.outputs.tag }} -m \"${{ steps.vars.outputs.tag }}\""
            echo "  git push origin ${{ steps.vars.outputs.tag }}"
            echo ""
            echo "Diff:"
            git --no-pager diff -- packages/runner/dist
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: Stoney Requirements-as-Code ${{ steps.vars.outputs.tag }}
          generate_release_notes: true