name: Changesets — Sync runner dist

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: read

jobs:
  sync_dist_if_version_pr:
    if: startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner dist
        run: pnpm -C packages/runner build

      - name: Commit dist if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/runner/dist; then
            echo "✅ dist unchanged"
            exit 0
          fi

          echo "🧱 dist changed — committing into version PR branch"
          git config user.name "stoney-bot"
          git config user.email "actions@users.noreply.github.com"

          git add packages/runner/dist
          git commit -m "chore(runner): update dist"
          git push