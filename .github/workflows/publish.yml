name: Publish Package

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com
          scope: "@stoney-dev"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Verify dist is committed
        run: |
          if ! git diff --quiet -- packages/runner/dist; then
            echo "❌ dist differs from build output; refuse publish"
            git --no-pager diff -- packages/runner/dist
            exit 1
          fi

      - name: Publish runner package
        working-directory: packages/runner
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}