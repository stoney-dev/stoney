name: Build runner dist

on:
  push:
    branches: [main]
    paths:
      - "packages/runner/src/**"
      - "packages/runner/package.json"
      - "packages/runner/tsconfig*.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

permissions:
  contents: write

jobs:
  build_and_commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: npm i -g pnpm@10

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Build runner
        run: pnpm -C packages/runner build

      - name: Commit dist if changed
        run: |
          set -euo pipefail

          if git diff --quiet -- packages/runner/dist; then
            echo "✅ dist unchanged"
            exit 0
          fi

          echo "🧱 dist changed — committing"
          git config user.name "stoney-bot"
          git config user.email "actions@users.noreply.github.com"

          git add packages/runner/dist
          git commit -m "chore(runner): update dist [skip ci]"
          git push