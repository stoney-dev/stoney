name: "Stoney Requirements-as-Code"
description: "Run Stoney contracts against a base URL and report failures in CI."

inputs:
  base_url:
    description: "Base URL"
    required: false

  suite:
    description: "Glob or file path"
    required: false
    default: "contracts/*.yml"

  token:
    description: "Bearer token"
    required: false

  timeout_ms:
    description: "Request timeout"
    required: false
    default: "15000"

  retries:
    description: "Retry count"
    required: false
    default: "2"

  fail_fast:
    description: "Stop on failure"
    required: false
    default: "false"

  report:
    description: "Report path"
    required: false
    default: "stoney-report.json"

  artifact_name:
    description: "Artifact name"
    required: false
    default: "stoney-report"

  comment_pr:
    description: "Post PR comment"
    required: false
    default: "true"

  require_work_item:
    description: "Require work_item"
    required: false
    default: "false"

  work_item_pattern:
    description: "Regex for work_item.key"
    required: false

  db_url:
    description: "DB connection string"
    required: false

runs:
  using: "composite"
  steps:
    - name: Run Stoney
      id: run_stoney
      shell: bash
      env:
        STONEY_BASE_URL: ${{ inputs.base_url }}
        STONEY_TOKEN: ${{ inputs.token }}
        STONEY_TIMEOUT_MS: ${{ inputs.timeout_ms }}
        STONEY_RETRIES: ${{ inputs.retries }}
        STONEY_DB_URL: ${{ inputs.db_url }}
        STONEY_REQUIRE_WORK_ITEM: ${{ inputs.require_work_item }}
        STONEY_WORK_ITEM_PATTERN: ${{ inputs.work_item_pattern }}
      run: |
        set +e

        REPORT_PATH="${{ github.workspace }}/${{ inputs.report }}"
        LOG_PATH="${{ github.workspace }}/stoney-action.log"

        node "${{ github.action_path }}/packages/runner/dist/cli.cjs" run \
          --suite "${{ inputs.suite }}" \
          --report "${REPORT_PATH}" \
          ${{ inputs.fail_fast == 'true' && '--fail-fast' || '' }} \
          ${{ inputs.require_work_item == 'true' && '--require-work-item' || '' }} \
          2>&1 | tee "${LOG_PATH}"

        exit_code=${PIPESTATUS[0]}

        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
        echo "log_path=${LOG_PATH}" >> "$GITHUB_OUTPUT"

        exit 0

    - name: Generate Job Summary
      if: always()
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ steps.run_stoney.outputs.report_path }}
        LOG_PATH: ${{ steps.run_stoney.outputs.log_path }}
        STONEY_EXIT_CODE: ${{ steps.run_stoney.outputs.exit_code }}
      with:
        script: |
          const fs = require("fs");

          const reportPath = process.env.REPORT_PATH;
          const logPath = process.env.LOG_PATH;
          const exitCode = Number(process.env.STONEY_EXIT_CODE || "0");

          if (fs.existsSync(reportPath) && fs.lstatSync(reportPath).isFile()) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

            await core.summary
              .addHeading(`🪨 Stoney Report — ${report.ok ? "✅ PASS" : "❌ FAIL"}`)
              .addTable([
                [{ data: "Metric", header: true }, { data: "Value", header: true }],
                ["Passed", String(report.passed)],
                ["Failed", String(report.failed)],
                ["Total", String(report.total)],
              ])
              .addHeading("Results", 3)
              .addRaw(
                report.results
                  .map((r) => `${r.ok ? "✅" : "❌"} **${r.id}** (${r.contract}): ${r.notes.join(", ") || "No notes"}`)
                  .join("<br>")
              )
              .write();

            return;
          }

          let logText = "No CLI log was captured.";
          if (fs.existsSync(logPath) && fs.lstatSync(logPath).isFile()) {
            logText = fs.readFileSync(logPath, "utf8").trim() || logText;
          }

          const snippet = logText.length > 12000
            ? logText.slice(-12000)
            : logText;

          await core.summary
            .addHeading(`🪨 Stoney Report — ❌ FAILED BEFORE REPORT`)
            .addRaw(`Exit code: **${exitCode}**<br><br>`)
            .addCodeBlock(snippet, "text")
            .write();

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ steps.run_stoney.outputs.report_path }}
          ${{ steps.run_stoney.outputs.log_path }}
        if-no-files-found: warn

    - name: Fail if Stoney failed
      if: always()
      shell: bash
      run: |
        exit "${{ steps.run_stoney.outputs.exit_code }}"