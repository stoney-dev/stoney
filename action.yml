name: "Stoney"
description: "Run Stoney contracts against a base URL and report failures in CI."
author: "stoneydev"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  base_url:
    description: "Base URL to run HTTP contracts against"
    required: false

  suite:
    description: "Glob or file path for suite files (e.g. contracts/*.yml)"
    required: false
    default: "contracts/*.yml"

  token:
    description: "Optional bearer token used by contracts via ${STONEY_TOKEN}"
    required: false

  timeout_ms:
    description: "Request timeout in ms"
    required: false
    default: "15000"

  retries:
    description: "Retry count for HTTP requests"
    required: false
    default: "2"

  report:
    description: "Report file path"
    required: false
    default: "stoney-report.json"

  upload_artifact:
    description: "Whether to upload the report as an artifact (true/false)"
    required: false
    default: "true"

  artifact_name:
    description: "Artifact name"
    required: false
    default: "stoney-report"

  comment_pr:
    description: "Post a PR comment summary"
    required: false
    default: "true"

  # ✅ Preferred behavior: require req.issue AND verify it exists in Jira (read-only)
  require_jira:
    description: "Require req.issue for every scenario AND verify issue exists in Jira (true/false)"
    required: false
    default: "false"

  # Optional DB invariants
  db_url:
    description: "Postgres connection string for SQL checks (STONEY_DB_URL)"
    required: false

  # Jira auth (required only if require_jira=true)
  jira_base_url:
    description: "Jira base URL (e.g. https://yourcompany.atlassian.net)"
    required: false
  jira_email:
    description: "Jira email"
    required: false
  jira_api_token:
    description: "Jira API token"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run Stoney
      shell: bash
      env:
        STONEY_BASE_URL: ${{ inputs.base_url }}
        STONEY_TOKEN: ${{ inputs.token }}
        STONEY_TIMEOUT_MS: ${{ inputs.timeout_ms }}
        STONEY_RETRIES: ${{ inputs.retries }}
        STONEY_DB_URL: ${{ inputs.db_url }}

        # Jira env consumed by jiraIssueExists()
        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        JIRA_EMAIL: ${{ inputs.jira_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
      run: |
        set -euo pipefail

        ARGS=()

        if [ "${{ inputs.require_jira }}" = "true" ]; then
          # fail fast if auth missing
          if [ -z "${{ inputs.jira_base_url }}" ] || [ -z "${{ inputs.jira_email }}" ] || [ -z "${{ inputs.jira_api_token }}" ]; then
            echo "require_jira=true but jira_base_url/jira_email/jira_api_token missing"
            exit 2
          fi
          ARGS+=( --require-jira )
        fi

        node "${{ github.action_path }}/packages/runner/dist/cli.cjs" run \
          --suite "${{ inputs.suite }}" \
          --base-url "${{ inputs.base_url }}" \
          --report "${{ inputs.report }}" \
          "${ARGS[@]}"

    - name: Upload report artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.report }}

    - name: PR comment summary
      if: ${{ inputs.comment_pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      env:
        INPUT_REPORT: ${{ inputs.report }}
        INPUT_ARTIFACT_NAME: ${{ inputs.artifact_name }}
        INPUT_SUITE: ${{ inputs.suite }}
      with:
        script: |
          const fs = require("fs");

          const reportPath = process.env.INPUT_REPORT || "stoney-report.json";
          const artifactName = process.env.INPUT_ARTIFACT_NAME || "stoney-report";

          if (!fs.existsSync(reportPath)) {
            core.warning(`Report not found at ${reportPath}`);
            return;
          }

          function clip(s, n) {
            s = String(s ?? "");
            if (s.length <= n) return s;
            return s.slice(0, n - 1) + "…";
          }

          function fence(label, content, max = 600) {
            const txt = clip(content ?? "", max);
            if (!txt) return null;
            const safe = txt.replace(/```/g, "``\\`");
            return `\n\`\`\`${label}\n${safe}\n\`\`\`\n`;
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

          const total = report.total ?? (Array.isArray(report.results) ? report.results.length : 0);
          const failed = report.failed ?? (Array.isArray(report.results) ? report.results.filter((r) => !r.ok).length : 0);
          const passed = report.passed ?? Math.max(0, total - failed);
          const baseUrl = report.baseUrl ?? "";
          const ok = !!report.ok;

          const bad = (report.results || []).filter((r) => !r.ok).slice(0, 10);

          const marker = "<!-- stoney-report -->";
          const lines = [];

          const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
          const runLink = `[workflow run](${runUrl})`;

          lines.push(marker);
          lines.push(`### 🪨 Stoney Report — ${ok ? "✅ PASS" : "❌ FAIL"}`);
          lines.push(`**${passed}/${total}** passed${failed ? ` · **${failed}** failed` : ""}`);
          lines.push("");
          lines.push(`- **Base URL:** ${baseUrl ? `\`${baseUrl}\`` : "_(not set)_"}`);
          lines.push(`- **Artifact:** \`${artifactName}\` · ${runLink}`);
          lines.push("");
          lines.push(`---`);

          if (!bad.length) {
            lines.push("");
            lines.push(`✅ All contracts satisfied. (See artifact \`${artifactName}\` for full JSON report.)`);
          } else {
            lines.push("");
            lines.push(`**Failures (showing first ${bad.length}):**`);
            lines.push("");

            for (const r of bad) {
              const title = `❌ ${r.contract} :: ${r.id}`;
              lines.push(`<details>`);
              lines.push(`<summary><strong>${title}</strong></summary>`);
              lines.push("");

              if (r.req) {
                const issue = r.req.issue ? String(r.req.issue) : "";
                const ac = Array.isArray(r.req.ac) ? r.req.ac.join(", ") : "";
                const text = r.req.text ? String(r.req.text) : "";
                const reqTag = [issue, ac].filter(Boolean).join(" ");
                const reqText = text ? ` — ${text}` : "";
                if (reqTag || reqText) lines.push(`- **Requirement:** ${clip(reqTag, 220)}${clip(reqText, 260)}`);

                if (Array.isArray(r.req.links) && r.req.links.length) {
                  const links = r.req.links.slice(0, 3).map((u) => `[link](${u})`).join(" · ");
                  lines.push(`- **Links:** ${links}`);
                }
              }

              if (Array.isArray(r.notes) && r.notes.length) {
                lines.push(`- **Notes:**`);
                for (const n of r.notes.slice(0, 3)) lines.push(`  - ${clip(n, 240)}`);
              }

              const steps = Array.isArray(r.steps) ? r.steps : [];
              const failing = steps.filter((s) => s && s.ok === false).slice(0, 2);

              if (failing.length) {
                lines.push(`- **Failing steps:**`);
                for (const s of failing) {
                  lines.push(`  - \`${clip(s.title, 140)}\``);

                  if (Array.isArray(s.notes) && s.notes.length) {
                    for (const n of s.notes.slice(0, 3)) lines.push(`    - ${clip(n, 240)}`);
                  }

                  const out = fence("text", s.stdout, 500);
                  const err = fence("text", s.stderr, 500);

                  if (out) lines.push(`\n**stdout**${out}`);
                  if (err) lines.push(`\n**stderr**${err}`);
                }
              }

              lines.push("");
              lines.push(`</details>`);
              lines.push("");
            }

            lines.push(`---`);
            lines.push(`📦 Full details: download artifact \`${artifactName}\` (JSON report).`);
          }

          const body = lines.join("\n");

          const pr = context.payload.pull_request;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = pr.number;

          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find((c) => (c.body || "").includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }