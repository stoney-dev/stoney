name: "Stoney"
runs:
  using: "composite"
  steps:
    - name: Run Stoney
      shell: bash
      env:
        STONEY_BASE_URL: ${{ inputs.base_url }}
      run: |
        node "${{ github.action_path }}/packages/runner/dist/cli.cjs" run \
          --suite "${{ inputs.suite }}" \
          --report "${{ github.workspace }}/${{ inputs.report }}"

    - name: Generate Job Summary
      if: always()
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ github.workspace }}/${{ inputs.report }}
      with:
        script: |
          const fs = require('fs');
          const reportPath = process.env.REPORT_PATH;
          
          // CRITICAL FIX: Ensure we only attempt to read if it is a real file
          if (!fs.existsSync(reportPath) || !fs.lstatSync(reportPath).isFile()) {
            await core.summary.addRaw('⚠️ No report file found at ' + reportPath).write();
            return;
          }

          const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
          
          await core.summary
            .addHeading(`🪨 Stoney Report — ${report.ok ? "✅ PASS" : "❌ FAIL"}`)
            .addTable([
              ['Metric', 'Value'],
              ['Passed', report.passed.toString()],
              ['Failed', report.failed.toString()],
              ['Total', report.total.toString()]
            ])
            .addRaw('<br><i>Visualize trends and manage team requirements at <a href="https://stoneydev.com">Stoney Cloud</a></i>')
            .write();

    - name: Upload Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: stoney-report
        path: ${{ github.workspace }}/${{ inputs.report }}