name: "Stoney Requirements-as-Code"
description: "Run Stoney contracts against a base URL and report failures in CI."
author: "stoney-dev"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  base_url: { description: "Base URL to run HTTP checks against", required: false }
  suite: { description: "Glob or file path for contract files", required: false, default: "contracts/*.yml" }
  token: { description: "Optional bearer token", required: false }
  timeout_ms: { description: "Request timeout in ms", required: false, default: "15000" }
  retries: { description: "Retry count", required: false, default: "2" }
  fail_fast: { description: "Stop on first failing check", required: false, default: "false" }
  report: { description: "Report file path", required: false, default: "stoney-report.json" }
  upload_artifact: { description: "Upload report as artifact", required: false, default: "true" }
  artifact_name: { description: "Artifact name", required: false, default: "stoney-report" }
  comment_pr: { description: "Post a PR comment summary", required: false, default: "true" }
  require_work_item: { description: "Require work_item on every check", required: false, default: "false" }
  work_item_pattern: { description: "Regex pattern for work_item", required: false }
  db_url: { description: "Postgres connection string", required: false }

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with: { node-version: 22 }

    - name: Run Stoney
      shell: bash
      env:
        STONEY_BASE_URL: ${{ inputs.base_url }}
        STONEY_TOKEN: ${{ inputs.token }}
        STONEY_TIMEOUT_MS: ${{ inputs.timeout_ms }}
        STONEY_RETRIES: ${{ inputs.retries }}
        STONEY_DB_URL: ${{ inputs.db_url }}
        STONEY_REQUIRE_WORK_ITEM: ${{ inputs.require_work_item }}
        STONEY_WORK_ITEM_PATTERN: ${{ inputs.work_item_pattern }}
      run: |
        set -euo pipefail
        CLI="${{ github.action_path }}/packages/runner/dist/cli.cjs"
        if [ ! -f "$CLI" ]; then echo "❌ Missing built runner at $CLI"; exit 1; fi
        
        ARGS=()
        if [ "${{ inputs.fail_fast }}" = "true" ]; then ARGS+=( --fail-fast ); fi
        if [ "${{ inputs.require_work_item }}" = "true" ]; then ARGS+=( --require-work-item ); fi
        if [ -n "${{ inputs.work_item_pattern }}" ]; then ARGS+=( --work-item-pattern "${{ inputs.work_item_pattern }}" ); fi

        node "$CLI" run \
          --suite "${{ inputs.suite }}" \
          --base-url "${{ inputs.base_url }}" \
          --report "${{ inputs.report }}" \
          "${ARGS[@]}"

    - name: Log Results Summary
      if: always()
      shell: bash
      run: |
        REPORT_PATH="${{ github.workspace }}/${{ inputs.report }}"
        if [ -f "$REPORT_PATH" ]; then
          echo "::group::🪨 Stoney Report Data"
          cat "$REPORT_PATH"
          echo "::endgroup::"
        else
          echo "⚠️ No report file found at $REPORT_PATH"
        fi

    - name: Upload report artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ github.workspace }}/${{ inputs.report }}

    - name: PR comment summary
      if: always() && inputs.comment_pr == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        INPUT_REPORT: ${{ inputs.report }}
      with:
        script: |
          const fs = require("fs");
          const path = require("path");
          const reportPath = path.join(process.env.GITHUB_WORKSPACE, process.env.INPUT_REPORT);
          if (!fs.existsSync(reportPath)) return;
          
          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const marker = "";
          const body = `${marker}\n### 🪨 Stoney Report — ${report.ok ? "✅ PASS" : "❌ FAIL"}\n` +
            `**${report.passed}/${report.total}** passed${report.failed ? ` · **${report.failed}** failed` : ""}\n\n` +
            `- **Base URL:** ${report.base_url ? `\`${report.base_url}\`` : "_(not set)_"}\n` +
            `- [View Workflow Run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n`;

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner, repo: context.repo.repo,
            issue_number: context.payload.pull_request.number,
          });
          
          const existing = comments.find((c) => (c.body || "").includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner, repo: context.repo.repo,
              comment_id: existing.id, body
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.payload.pull_request.number, body
            });
          }