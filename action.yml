name: "Stoney"
description: "Run Stoney contracts against a base URL and report failures in CI."
author: "stoneydev"
branding:
  icon: "check-circle"
  color: "purple"

inputs:
  base_url:
    description: "Base URL to run HTTP contracts against"
    required: false

  suite:
    description: "Glob or file path for suite files (e.g. contracts/*.yml)"
    required: false
    default: "contracts/*.yml"

  token:
    description: "Optional bearer token used by contracts via ${STONEY_TOKEN}"
    required: false

  timeout_ms:
    description: "Request timeout in ms"
    required: false
    default: "15000"

  retries:
    description: "Retry count for HTTP requests"
    required: false
    default: "2"

  report:
    description: "Report file path"
    required: false
    default: "stoney-report.json"

  upload_artifact:
    description: "Whether to upload the report as an artifact (true/false)"
    required: false
    default: "true"

  artifact_name:
    description: "Artifact name"
    required: false
    default: "stoney-report"

  comment_pr:
    description: "Post a PR comment summary"
    required: false
    default: "true"

  # ✅ requirements enforcement
  require_req:
    description: "Fail if a scenario is missing req mapping (true/false)"
    required: false
    default: "false"

  # Optional DB invariants
  db_url:
    description: "Postgres connection string for SQL checks (STONEY_DB_URL)"
    required: false

  # Optional Jira suite loading + creation (still supported, but not required)
  jira_issue:
    description: "Optional Jira issue key (or comma-separated keys) containing a suite in a code block"
    required: false

  jira_base_url:
    description: "Jira base URL (e.g. https://yourcompany.atlassian.net)"
    required: false
  jira_email:
    description: "Jira email"
    required: false
  jira_api_token:
    description: "Jira API token"
    required: false

  jira_create_on_failure:
    description: "Create Jira issue(s) when failures exist (true/false)"
    required: false
    default: "false"

  jira_project_key:
    description: "Jira project key (e.g. ENG)"
    required: false

  jira_issue_type:
    description: "Preferred Jira issue type name (Bug/Task/etc). Runner will resolve to a valid type for the project."
    required: false
    default: "Bug"

  jira_issue_type_id:
    description: "Preferred issue type id (most reliable). Optional."
    required: false

  jira_create_mode:
    description: "run|scenario (one issue per run, or per failing scenario)"
    required: false
    default: "run"

  jira_labels:
    description: "Comma-separated labels"
    required: false

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Run Stoney
      shell: bash
      env:
        STONEY_BASE_URL: ${{ inputs.base_url }}
        STONEY_TOKEN: ${{ inputs.token }}
        STONEY_TIMEOUT_MS: ${{ inputs.timeout_ms }}
        STONEY_RETRIES: ${{ inputs.retries }}
        STONEY_DB_URL: ${{ inputs.db_url }}

        JIRA_BASE_URL: ${{ inputs.jira_base_url }}
        JIRA_EMAIL: ${{ inputs.jira_email }}
        JIRA_API_TOKEN: ${{ inputs.jira_api_token }}
      run: |
        set -euo pipefail

        REQ_ARGS=()
        if [ "${{ inputs.require_req }}" = "true" ]; then
          REQ_ARGS+=( --require-req )
        fi

        JIRA_ARGS=()
        if [ -n "${{ inputs.jira_issue }}" ]; then
          IFS=',' read -ra KEYS <<< "${{ inputs.jira_issue }}"
          for k in "${KEYS[@]}"; do
            kk="$(echo "$k" | xargs)"
            if [ -n "$kk" ]; then
              JIRA_ARGS+=( --jira-issue "$kk" )
            fi
          done
        fi

        CREATE_ARGS=()
        if [ "${{ inputs.jira_create_on_failure }}" = "true" ]; then
          if [ -z "${{ inputs.jira_project_key }}" ]; then
            echo "jira_create_on_failure=true but jira_project_key is missing"
            exit 2
          fi
          if [ -z "${{ inputs.jira_base_url }}" ] || [ -z "${{ inputs.jira_email }}" ] || [ -z "${{ inputs.jira_api_token }}" ]; then
            echo "jira_create_on_failure=true but jira_base_url/jira_email/jira_api_token missing"
            exit 2
          fi

          CREATE_ARGS+=( --jira-create-on-failure )
          CREATE_ARGS+=( --jira-project-key "${{ inputs.jira_project_key }}" )
          CREATE_ARGS+=( --jira-issue-type "${{ inputs.jira_issue_type }}" )
          CREATE_ARGS+=( --jira-create-mode "${{ inputs.jira_create_mode }}" )

          if [ -n "${{ inputs.jira_issue_type_id }}" ]; then
            CREATE_ARGS+=( --jira-issue-type-id "${{ inputs.jira_issue_type_id }}" )
          fi
          if [ -n "${{ inputs.jira_labels }}" ]; then
            CREATE_ARGS+=( --jira-labels "${{ inputs.jira_labels }}" )
          fi
        fi

        node "${{ github.action_path }}/packages/runner/dist/cli.cjs" run \
          --suite "${{ inputs.suite }}" \
          --report "${{ inputs.report }}" \
          "${REQ_ARGS[@]}" \
          "${JIRA_ARGS[@]}" \
          "${CREATE_ARGS[@]}"

    - name: Upload report artifact
      if: ${{ inputs.upload_artifact == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: ${{ inputs.report }}

    - name: PR comment summary
      if: ${{ inputs.comment_pr == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require("fs");

          const reportPath = process.env.INPUT_REPORT || "stoney-report.json";
          const artifactName = process.env.INPUT_ARTIFACT_NAME || "stoney-report";

          if (!fs.existsSync(reportPath)) {
            core.warning(`Report not found at ${reportPath}`);
            return;
          }

          const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));
          const total = report.total ?? 0;
          const failed = report.failed ?? 0;
          const passed = report.passed ?? (total - failed);
          const baseUrl = report.baseUrl ?? "";
          const ok = !!report.ok;

          const bad = (report.results || []).filter((r) => !r.ok).slice(0, 10);

          const marker = "<!-- stoney-report -->";
          const lines = [];
          lines.push(marker);
          lines.push(`### 🪨 Stoney report`);
          if (baseUrl) lines.push(`**Base URL:** \`${baseUrl}\``);
          lines.push(`**Result:** ${ok ? "✅ PASS" : "❌ FAIL"} — **${passed}/${total}** passed`);

          if (bad.length) {
            lines.push(`\n**Failures (first ${bad.length}):**`);

            for (const r of bad) {
              lines.push(`- ❌ \`${r.contract} :: ${r.id}\``);

              // req mapping (optional)
              if (r.req) {
                const issue = r.req.issue ? String(r.req.issue) : "";
                const ac = Array.isArray(r.req.ac) ? r.req.ac.join(", ") : "";
                const text = r.req.text ? String(r.req.text) : "";
                const tag = [issue, ac].filter(Boolean).join(" ");
                const reqLine = [tag, text].filter(Boolean).join(" — ");
                if (reqLine) lines.push(`  - req: ${reqLine}`);
              }

              // scenario notes (cap)
              if (Array.isArray(r.notes) && r.notes.length) {
                for (const n of r.notes.slice(0, 3)) lines.push(`  - ${n}`);
              }

              // show up to 2 failing steps with a few notes + optional output
              const steps = Array.isArray(r.steps) ? r.steps : [];
              const failing = steps.filter((s) => s && s.ok === false).slice(0, 2);

              for (const s of failing) {
                lines.push(`  - step: \`${s.title}\``);

                if (Array.isArray(s.notes) && s.notes.length) {
                  for (const n of s.notes.slice(0, 3)) lines.push(`    - ${n}`);
                }

                if (s.stdout) lines.push(`    - stdout: \`${String(s.stdout).slice(0, 180)}\``);
                if (s.stderr) lines.push(`    - stderr: \`${String(s.stderr).slice(0, 180)}\``);
              }
            }

            lines.push(`\n(See artifact \`${artifactName}\` for full JSON report.)`);
          }

          const body = lines.join("\n");

          const pr = context.payload.pull_request;
          const owner = context.repo.owner;
          const repo = context.repo.repo;
          const issue_number = pr.number;

          const { data: comments } = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number,
            per_page: 100,
          });

          const existing = comments.find((c) => (c.body || "").includes(marker));

          if (existing) {
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
          }
