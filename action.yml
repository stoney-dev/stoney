name: "Stoney Requirements-as-Code"
description: "Run Stoney contracts and enforce business rules in CI."

inputs:
  api_url:
    description: "Base URL for HTTP contract steps. Use a repo secret: ${{ secrets.API_URL }}"
    required: false

  suite:
    description: "Glob pattern for contract files"
    required: false
    default: "contracts/*.yml"

  stoney_token:
    description: "Stoney dashboard token for premium users. Use a repo secret: ${{ secrets.STONEY_TOKEN }}"
    required: false

  db_url:
    description: "Postgres connection string for SQL steps. Use a repo secret: ${{ secrets.DB_URL }}"
    required: false

  timeout_ms:
    description: "Per-request timeout in milliseconds"
    required: false
    default: "15000"

  retries:
    description: "Retry count for flaky HTTP steps"
    required: false
    default: "2"

  fail_fast:
    description: "Stop on first failure"
    required: false
    default: "false"

  report:
    description: "Output path for the JSON report"
    required: false
    default: "stoney-report.json"

  artifact_name:
    description: "Name of the uploaded artifact"
    required: false
    default: "stoney-report"

  require_work_item:
    description: "Fail if any check is missing a work_item"
    required: false
    default: "false"

  work_item_pattern:
    description: "Regex that work_item.key must match (e.g. ^KAN-\\d+$)"
    required: false

runs:
  using: "composite"
  steps:
    - name: Verify bundled runner exists
      shell: bash
      run: |
        set -euo pipefail
        CLI_PATH="${{ github.action_path }}/packages/runner/dist/cli.cjs"
        if [ ! -f "${CLI_PATH}" ]; then
          echo "❌ Bundled CLI not found at ${CLI_PATH}"
          exit 1
        fi

    - name: Install runtime dependencies
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}/packages/runner"
        npm install --omit=dev --ignore-scripts 2>&1 | tail -5

    - name: Smoke test CLI
      shell: bash
      run: |
        set -euo pipefail
        node "${{ github.action_path }}/packages/runner/dist/cli.cjs" hello

    # ── FIX: composite actions cannot use ${{ inputs.* }} inside env: blocks.
    # Write all input values to GITHUB_ENV here so subsequent steps can read
    # them as ordinary environment variables without any template expressions
    # in env: keys/values (which GitHub rejects at parse time).
    - name: Export inputs to environment
      shell: bash
      run: |
        set -euo pipefail
        # ${{ inputs.* }} IS allowed inside a run: script — GitHub interpolates
        # it before handing the script to the shell, so this is safe.
        {
          echo "STONEY_BASE_URL=${{ inputs.api_url }}"
          echo "STONEY_TOKEN=${{ inputs.stoney_token }}"
          echo "STONEY_DB_URL=${{ inputs.db_url }}"
          echo "STONEY_TIMEOUT_MS=${{ inputs.timeout_ms }}"
          echo "STONEY_RETRIES=${{ inputs.retries }}"
          echo "STONEY_REQUIRE_WORK_ITEM=${{ inputs.require_work_item }}"
          echo "STONEY_WORK_ITEM_PATTERN=${{ inputs.work_item_pattern }}"
        } >> "$GITHUB_ENV"

    - name: Run Stoney
      id: run_stoney
      shell: bash
      # No env: block here — all STONEY_* vars are already in the environment
      # from the "Export inputs" step above.
      run: |
        set +e

        REPORT_PATH="${{ github.workspace }}/${{ inputs.report }}"
        LOG_PATH="${{ github.workspace }}/stoney-action.log"
        CLI_PATH="${{ github.action_path }}/packages/runner/dist/cli.cjs"

        rm -f "${REPORT_PATH}" "${LOG_PATH}"

        STONEY_ARGS=(
          --suite "${{ github.workspace }}/${{ inputs.suite }}"
          --report "${REPORT_PATH}"
        )

        if [ "${{ inputs.fail_fast }}" = "true" ]; then
          STONEY_ARGS+=(--fail-fast)
        fi

        if [ "${{ inputs.require_work_item }}" = "true" ]; then
          STONEY_ARGS+=(--require-work-item)
        fi

        cd "${{ github.workspace }}"

        node "${CLI_PATH}" run "${STONEY_ARGS[@]}" \
          2>&1 | tee "${LOG_PATH}"

        exit_code=${PIPESTATUS[0]}

        if [ "${exit_code}" = "0" ] && [ ! -f "${REPORT_PATH}" ]; then
          echo "❌ CLI exited 0 but no report was created at ${REPORT_PATH}" | tee -a "${LOG_PATH}"
          exit_code=1
        fi

        echo "exit_code=${exit_code}" >> "$GITHUB_OUTPUT"
        echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
        echo "log_path=${LOG_PATH}" >> "$GITHUB_OUTPUT"

        exit 0

    - name: Generate Job Summary
      if: always()
      uses: actions/github-script@v7
      env:
        REPORT_PATH: ${{ steps.run_stoney.outputs.report_path }}
        LOG_PATH: ${{ steps.run_stoney.outputs.log_path }}
        STONEY_EXIT_CODE: ${{ steps.run_stoney.outputs.exit_code }}
      with:
        script: |
          const fs = require("fs");

          const reportPath = process.env.REPORT_PATH;
          const logPath = process.env.LOG_PATH;
          const exitCode = Number(process.env.STONEY_EXIT_CODE || "1");

          if (reportPath && fs.existsSync(reportPath) && fs.lstatSync(reportPath).isFile()) {
            const report = JSON.parse(fs.readFileSync(reportPath, "utf8"));

            await core.summary
              .addHeading(`🪨 Stoney Report — ${report.ok ? "✅ PASS" : "❌ FAIL"}`)
              .addTable([
                [{ data: "Metric", header: true }, { data: "Value", header: true }],
                ["Passed", String(report.passed)],
                ["Failed", String(report.failed)],
                ["Total", String(report.total)],
              ])
              .addHeading("Results", 3)
              .addRaw(
                report.results
                  .map((r) => `${r.ok ? "✅" : "❌"} **${r.id}** (${r.contract}): ${r.notes.join(", ") || "No notes"}`)
                  .join("<br>")
              )
              .write();

            return;
          }

          let logText = "No CLI log was captured.";
          if (logPath && fs.existsSync(logPath) && fs.lstatSync(logPath).isFile()) {
            logText = fs.readFileSync(logPath, "utf8").trim() || logText;
          }

          const snippet = logText.length > 12000 ? logText.slice(-12000) : logText;

          await core.summary
            .addHeading("🪨 Stoney Report — ❌ FAILED BEFORE REPORT")
            .addRaw(`Exit code: **${exitCode}**<br><br>`)
            .addCodeBlock(snippet, "text")
            .write();

    - name: Upload artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact_name }}
        path: |
          ${{ steps.run_stoney.outputs.report_path }}
          ${{ steps.run_stoney.outputs.log_path }}
        if-no-files-found: warn

    - name: Fail if Stoney failed
      if: always()
      shell: bash
      run: |
        exit "${EXIT_CODE:-1}"
      env:
        EXIT_CODE: ${{ steps.run_stoney.outputs.exit_code }}
