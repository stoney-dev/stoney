version: 1
suite: core

contracts:
  - name: health
    req:
      issue: "KAN-100"
      links:
        - "https://confluence.example.com/health-spec"
    scenarios:
      - id: health_ok
        req:
          ac: ["AC-1"]
          text: "GET /health returns 200 with ok:true"
        steps:
          - http:
              method: GET
              path: /health
            expect:
              status: 200
              json:
                ok: true

  - name: ping
    scenarios:
      - id: ping_ok
        req:
          issue: "KAN-100"
          ac: ["AC-2"]
          text: "Public ping works"
        steps:
          - http:
              method: GET
              path: /v1/ping
            expect:
              status: 200
              json:
                ok: true

  - name: exec_checks
    scenarios:
      - id: runs_smoke_script
        req:
          issue: "KAN-100"
          ac: ["AC-3"]
          text: "Node is available in CI runner"
        steps:
          - exec:
              run: "node -v"
            expect:
              exit_code: 0
              stdout_regex: "^v\\d+\\."
