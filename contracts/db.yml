version: 1
suite: db

contracts:
  - name: db_invariants
    scenarios:
      - id: users_table_exists
        req:
          issue: "KAN-102"
          ac: ["AC-1"]
          text: "Users table exists"
        steps:
          - sql:
              driver: postgres
              url_env: STONEY_DB_URL
              query: |
                SELECT to_regclass('public.users') AS table_name;
            expect:
              rows: 1
              equals:
                table_name: users

      - id: no_failed_jobs
        req:
          issue: "KAN-102"
          ac: ["AC-2"]
          text: "No failed jobs"
        steps:
          - sql:
              driver: postgres
              url_env: STONEY_DB_URL
              query: |
                SELECT COUNT(*)::int AS failed
                FROM jobs
                WHERE status = 'failed';
            expect:
              rows: 1
              equals:
                failed: 0
