version: 1
feature: db

contracts:
  - name: db_invariants
    checks:
      - id: users_table_exists
        work_item: "KAN-102"
        says: "Users table exists (AC-1)"
        do:
          - sql:
              driver: postgres
              url_env: STONEY_DB_URL
              query: |
                SELECT to_regclass('public.users') AS table_name;
            then:
              rows: 1
              equals:
                table_name: users

      - id: no_failed_jobs
        work_item: "KAN-102"
        says: "No failed jobs (AC-2)"
        do:
          - sql:
              driver: postgres
              url_env: STONEY_DB_URL
              query: |
                SELECT COUNT(*)::int AS failed
                FROM jobs
                WHERE status = 'failed';
            then:
              rows: 1
              equals:
                failed: 0