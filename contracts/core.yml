version: 1
feature: core

contracts:
  - name: health
    description: "Health endpoints"
    checks:
      - id: health_ok
        work_item: "KAN-100"
        says: "GET /health returns 200 with ok:true (AC-1)"
        links:
          - "https://confluence.example.com/health-spec"
        do:
          - http:
              method: GET
              path: /health
            then:
              status: 200
              json:
                ok: true

  - name: ping
    checks:
      - id: ping_ok
        work_item: "KAN-100"
        says: "Public ping works (AC-2)"
        do:
          - http:
              method: GET
              path: /v1/ping
            then:
              status: 200
              json:
                ok: true

  - name: exec_checks
    checks:
      - id: runs_smoke_script
        work_item: "KAN-100"
        says: "Node is available in CI runner (AC-3)"
        do:
          - exec:
              run: "node -v"
            then:
              exit_code: 0
              stdout_regex: "^v\\d+\\."