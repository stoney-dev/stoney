version: 1
feature: private

contracts:
  - name: private_ping
    checks:
      - id: private_requires_token
        work_item: "KAN-101"
        says: "Private endpoints require token (AC-1)"
        do:
          - http:
              method: GET
              path: /private/ping
              headers:
                Authorization: "Bearer ${STONEY_TOKEN}"
            then:
              status: 200
              json:
                private: true