version: 1
feature: smoke
description: Minimal exec smoke test

contracts:
  - name: exec_smoke
    description: Verifies bundled CLI can parse and run a simple exec contract
    checks:
      - id: smoke_exec
        work_item: "KAN-1"
        says: "Runner can execute a basic shell command"
        steps:
          - exec:
              run: "echo hello"
            expect:
              exit_code: 0
              stdout_contains: "hello"